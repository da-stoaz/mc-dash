# SPDX-License-Identifier: AGPL-3.0-only

# Runs the backend test suite, then builds, verifies and publishes the panel
# images that docker-compose.yml pulls:
#   ghcr.io/da-stoaz/mc-dash-backend, ghcr.io/da-stoaz/mc-dash-frontend
# main -> :latest, :main, :sha-<short>, and for a new version :1.2.3 and :1.2
#
# Versions: every pull request bumps the version in the package.json files
# (npm run version:bump -- patch|minor|major); the version job enforces it.
# When main reaches a version that has no v<version> tag yet, the images are
# also tagged with it and, after both are pushed, a GitHub release v<version>
# is created. A release therefore means its images can be pulled.
#
# Pull requests run everything except publishing. Images are never published
# from a commit whose backend tests fail.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded pull request runs are cancelled. Runs on main never are: each one
# may be the only build of a version, and cancelling it would skip its images
# and release.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version is consistent and higher than the target branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node scripts/version.cjs check --base FETCH_HEAD

  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Same Node major as the backend image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # File operations use python3 (preinstalled on the runner), as in the image.
      - name: Test
        run: npm test

  images:
    needs: backend-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the v<version> release
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A version that already has a release is not published again: its
      # version tags and release stay pointing at the build that made them.
      - name: Version
        id: version
        run: |
          version=$(node scripts/version.cjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              echo "::warning::v$version is already released, so this build is published as latest/main/sha only. Bump the version in every pull request."
            fi
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: License headers and deployment config tests
        run: |
          npm --prefix frontend ci
          npm run test:license
          npm run test:version
          npm run test:deployment
          npm --prefix frontend run test:config

      - uses: docker/setup-buildx-action@v3

      # Build into the local daemon first so the runtime test exercises exactly
      # what gets pushed; the push below reuses the same build cache.
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: mc-dash-backend:deployment-check
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: mc-dash-frontend:deployment-check
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Runtime test (UI, /api proxy, login, live updates, uploads)
        run: npm run test:deployment:runtime

      - name: Production compose on Linux host networking
        run: npm run test:deployment:host

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend tags
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/mc-dash-backend
          # GitHub reports the repository license as AGPL-3.0; keep the exact SPDX id.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.new == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.new == 'true' }}

      - name: Frontend tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/mc-dash-frontend
          # GitHub reports the repository license as AGPL-3.0; keep the exact SPDX id.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.new == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.new == 'true' }}

      - name: Push backend
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend

      - name: Push frontend
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend

      # Last, so a release only exists once both of its images can be pulled.
      - name: Release
        if: github.event_name == 'push' && steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "MC Dash $VERSION" --generate-notes
