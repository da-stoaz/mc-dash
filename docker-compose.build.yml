# Build the panel images from this checkout instead of pulling them:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  backend:
    build: ./backend
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
