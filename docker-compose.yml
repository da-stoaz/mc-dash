# Production on Linux: this file plus one .env, two prebuilt panel images.
#   docker compose pull && docker compose up -d
# Host networking keeps the existing router and published Minecraft ports reachable.
# Both panel services remain OUTSIDE minecraft.slice. See DEPLOY.md.
# To build the images from a checkout instead: add -f docker-compose.build.yml.
name: mc-dash

services:
  backend:
    image: ghcr.io/da-stoaz/mc-dash-backend:${MC_DASH_VERSION:-latest}
    labels:
      io.mc-dash.role: backend
    restart: unless-stopped
    network_mode: host
    cgroup: host
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${MC_DASH_BACKEND_PORT:-4000}
      MC_DASH_BIND_HOST: 127.0.0.1
      MC_DASH_TRUST_PROXY: loopback
      DATA_ROOT: ${DATA_ROOT:?Set the absolute host data directory in .env}
      MC_CONTAINER_USER: ${MC_CONTAINER_USER:?Set the Minecraft process uid:gid in .env}
      MC_DASH_MEMORY_POOL: ${MC_DASH_MEMORY_POOL:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - type: bind
        source: ${DATA_ROOT:?Set the absolute host data directory in .env}
        target: ${DATA_ROOT:?Set the absolute host data directory in .env}
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    image: ghcr.io/da-stoaz/mc-dash-frontend:${MC_DASH_VERSION:-latest}
    labels:
      io.mc-dash.role: frontend
    restart: unless-stopped
    network_mode: host
    # No env_file here: backend credentials must not enter the frontend container.
    environment:
      NODE_ENV: production
      PORT: ${MC_DASH_FRONTEND_PORT:-3000}
      # Next's server listens on HOSTNAME (with host networking, Docker would set the host's name).
      HOSTNAME: ${MC_DASH_FRONTEND_BIND_HOST:-127.0.0.1}
      MC_DASH_BACKEND_URL: http://127.0.0.1:${MC_DASH_BACKEND_PORT:-4000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
